<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 员工团队 · 钛核 TAICORE</title>
<style>
  :root{--bg:#05070D;--panel:#0B101C;--line:#1B2540;--cyan:#00E0FF;--violet:#7A5CFF;--gold:#FFC65C;--ok:#22D3A5;--text:#E9EFFA;--sub:#9AA9C2;--dim:#5C6B85;--grad:linear-gradient(135deg,#00E0FF,#7A5CFF)}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(70% 60% at 50% -10%,rgba(0,224,255,.10),transparent),var(--bg);color:var(--text);
    font-family:"Inter","HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:14px;line-height:1.65}
  .wrap{max-width:1080px;margin:0 auto;padding:24px 18px 80px}
  header{display:flex;align-items:center;gap:12px;padding:6px 0 18px}
  .logo{width:30px;height:30px}
  .brand b{font-size:16px}.brand small{display:block;font-size:9px;letter-spacing:.32em;color:var(--dim)}
  .sp{flex:1}
  .tabs{display:flex;gap:8px;margin-bottom:16px;border-bottom:1px solid #16203A;padding-bottom:10px}
  .tab{padding:9px 15px;border-radius:10px;cursor:pointer;color:var(--sub);font-weight:650;font-size:13.5px}
  .tab.on{background:rgba(0,224,255,.1);color:#DFF9FF;box-shadow:inset 0 0 0 1px rgba(0,224,255,.25)}
  .pane{display:none}.pane.on{display:block}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:18px;margin-bottom:14px}
  .card h3{margin:0 0 12px;font-size:14.5px;display:flex;align-items:center;gap:8px}
  .card h3:before{content:"";width:4px;height:14px;border-radius:2px;background:var(--grad)}
  label{display:block;font-size:12px;color:var(--sub);margin:10px 0 5px}
  input,select,textarea{width:100%;background:#070B14;border:1px solid #1C2740;border-radius:9px;color:#DCE7F5;padding:9px 11px;font-size:13px;font-family:inherit}
  textarea{min-height:80px;resize:vertical}
  button{border:0;cursor:pointer;padding:10px 16px;border-radius:10px;background:var(--grad);color:#04121A;font-weight:750;font-size:13px;font-family:inherit}
  button.ghost{background:rgba(255,255,255,.06);color:var(--text);border:1px solid #26344F}
  button.mini{padding:6px 10px;font-size:12px}
  button:disabled{opacity:.55;cursor:wait}
  .staff-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
  .emp{border:1px solid #1C2740;border-radius:12px;padding:12px;background:#0A0F1A;cursor:pointer;transition:.15s;position:relative}
  .emp:hover{border-color:#2C6C82}
  .emp.on{border-color:var(--cyan);background:rgba(0,224,255,.08)}
  .emp .av{font-size:22px;line-height:1}
  .emp b{display:block;margin-top:6px;font-size:13.5px}
  .emp span{font-size:11.5px;color:var(--dim)}
  .emp .ck{position:absolute;top:10px;right:10px;font-size:12px;color:var(--cyan);display:none}
  .emp.on .ck{display:block}
  .msg{font-size:12.5px;margin-top:8px;min-height:18px}.msg.ok{color:var(--ok)}.msg.err{color:#FF6B7A}
  .speech{border-left:3px solid #22304A;padding:10px 14px;margin:12px 0;background:#0A0F1A;border-radius:0 10px 10px 0}
  .speech .who{font-size:12.5px;color:#9BE9FF;margin-bottom:4px;font-weight:700}
  .speech .txt{font-size:13px;color:#D6E3F2;white-space:pre-wrap}
  .summary{border:1px solid rgba(0,224,255,.3);background:rgba(0,224,255,.07);border-radius:12px;padding:14px;white-space:pre-wrap;font-size:13px;color:#DFF6FF;margin-top:14px}
  .chatbox{max-height:460px;overflow:auto;padding-right:6px}
  .bubble{max-width:82%;padding:10px 13px;border-radius:12px;margin:9px 0;font-size:13px;white-space:pre-wrap;line-height:1.8}
  .bubble.me{margin-left:auto;background:rgba(0,224,255,.14);border:1px solid rgba(0,224,255,.25)}
  .bubble.ai{background:#0A0F1A;border:1px solid #1C2740}
  .bubble .who{font-size:11px;color:var(--dim);margin-bottom:3px}
  .row{display:flex;gap:9px;align-items:flex-end}.row>div{flex:1}
  .muted{color:var(--dim);font-size:12px}
  .prompt-area{font-family:ui-monospace,Consolas,monospace;font-size:12px}
  @media (max-width:720px){.row{flex-direction:column;align-items:stretch}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="logo" viewBox="0 0 96 96"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00E0FF"/><stop offset="1" stop-color="#7A5CFF"/></linearGradient></defs>
      <path d="M88 48 L68 83 L28 83 L8 48 L28 13 L68 13 Z" fill="none" stroke="url(#g)" stroke-width="6" stroke-linejoin="round"/>
      <path d="M54.5 24 L39.5 51 H48.5 L43.5 72 L60.5 43.5 H51 Z" fill="#D9FBFF"/></svg>
    <div class="brand"><b>AI 员工团队</b><small>TAICORE</small></div>
    <div class="sp"></div>
    <span class="muted" id="modeLabel"></span>
  </header>

  <div class="tabs">
    <div class="tab on" data-pane="group">圆桌会议</div>
    <div class="tab" data-pane="chat">单聊</div>
    <div class="tab" data-pane="staff">员工</div>
  </div>

  <!-- 圆桌 -->
  <div class="pane on" id="pane-group">
    <div class="card">
      <h3>选员工开会</h3>
      <div class="staff-grid" id="pickList"></div>
      <label style="margin-top:14px">议题</label>
      <textarea id="topic" placeholder="例：这个月怎么把到店客流提 30%？预算 3000 元。"></textarea>
      <div style="margin-top:12px;display:flex;gap:9px;align-items:center">
        <button id="meet">开会</button>
        <span class="msg" id="meetMsg"></span>
      </div>
    </div>
    <div id="meetOut"></div>
  </div>

  <!-- 单聊 -->
  <div class="pane" id="pane-chat">
    <div class="card">
      <h3>和谁聊</h3>
      <select id="chatStaff"></select>
    </div>
    <div class="card">
      <div class="chatbox" id="chatBox"></div>
      <div class="row" style="margin-top:12px">
        <div><textarea id="chatInput" placeholder="说点什么…（Ctrl+Enter 发送）" style="min-height:60px"></textarea></div>
        <button id="send">发送</button>
      </div>
    </div>
  </div>

  <!-- 员工 -->
  <div class="pane" id="pane-staff">
    <div class="card">
      <h3>我的 AI 员工</h3>
      <div class="staff-grid" id="staffList"></div>
    </div>
    <div class="card">
      <h3>新增 / 编辑员工</h3>
      <div class="row">
        <div><label>名字</label><input id="s-name" type="text" placeholder="例：店长阿May"></div>
        <div><label>岗位</label><input id="s-role" type="text" placeholder="例：运营负责人"></div>
        <div><label>头像 emoji</label><input id="s-emoji" type="text" placeholder="🧭"></div>
      </div>
      <label>角色提示词（决定他是谁、怎么回答）</label>
      <textarea id="s-prompt" class="prompt-area" placeholder="你是一家门店的运营负责人，擅长把目标拆成周计划…"></textarea>
      <div style="margin-top:12px;display:flex;gap:9px;align-items:center">
        <button id="saveStaff">保存员工</button>
        <span class="msg" id="staffMsg"></span>
      </div>
    </div>
    <div class="card">
      <h3>店铺信息与模型</h3>
      <div class="row">
        <div><label>店名</label><input id="shopName" type="text" placeholder="例：山城老灶"></div>
        <div><label>行业</label><input id="industry" type="text" placeholder="例：牛肉面馆"></div>
      </div>
      <label>DeepSeek API Key（不填走演示模式）</label><input id="apiKey" type="password" placeholder="sk-...">
      <div style="margin-top:12px"><button id="saveSet">保存设置</button> <span class="msg" id="setMsg"></span></div>
    </div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
let staff = [], picked = new Set(), chatHistory = [];

document.querySelectorAll('.tab').forEach((t) => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach((x) => x.classList.remove('on'));
    document.querySelectorAll('.pane').forEach((x) => x.classList.remove('on'));
    t.classList.add('on');
    document.getElementById('pane-' + t.dataset.pane).classList.add('on');
    if (t.dataset.pane === 'staff') renderStaff();
    if (t.dataset.pane === 'chat') renderChatStaff();
  });
});

async function loadSettings() {
  const s = await (await fetch('/api/settings')).json();
  $('#shopName').value = s.shopName || '';
  $('#industry').value = s.industry || '';
  $('#apiKey').placeholder = s.hasKey ? '已保存（留空不变）' : 'sk-...';
  $('#modeLabel').textContent = s.hasKey ? 'AI 模式' : '演示模式（配置 Key 后真实回答）';
}
$('#saveSet').addEventListener('click', async () => {
  const body = { shopName: $('#shopName').value, industry: $('#industry').value };
  if ($('#apiKey').value.trim()) body.apiKey = $('#apiKey').value.trim();
  await fetch('/api/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  $('#setMsg').className = 'msg ok'; $('#setMsg').textContent = '已保存';
  loadSettings();
});

async function loadStaff() {
  staff = await (await fetch('/api/staff')).json();
  renderPick(); renderStaff(); renderChatStaff();
}

function renderPick() {
  const box = $('#pickList');
  box.innerHTML = staff.map((e) => `
    <div class="emp ${picked.has(e.id) ? 'on' : ''}" data-id="${e.id}">
      <div class="ck">✓</div>
      <div class="av">${e.emoji}</div>
      <b>${e.name}</b><span>${e.role}</span>
    </div>`).join('');
  box.querySelectorAll('.emp').forEach((el) => el.addEventListener('click', () => {
    const id = el.dataset.id;
    if (picked.has(id)) picked.delete(id); else picked.add(id);
    el.classList.toggle('on');
  }));
}

function renderStaff() {
  const box = $('#staffList');
  box.innerHTML = staff.map((e) => `
    <div class="emp">
      <div class="av">${e.emoji}</div>
      <b>${e.name}</b><span>${e.role}</span>
      <div style="margin-top:8px;display:flex;gap:6px">
        <button class="ghost mini" data-edit="${e.id}">编辑</button>
        <button class="ghost mini" data-del="${e.id}">删除</button>
      </div>
    </div>`).join('');
  box.querySelectorAll('[data-edit]').forEach((b) => b.addEventListener('click', () => {
    const e = staff.find((x) => x.id === b.dataset.edit);
    $('#s-name').value = e.name; $('#s-role').value = e.role; $('#s-emoji').value = e.emoji; $('#s-prompt').value = e.prompt;
    $('#s-name').dataset.editing = e.id;
    $('#staffMsg').textContent = '正在编辑：' + e.name;
  }));
  box.querySelectorAll('[data-del]').forEach((b) => b.addEventListener('click', async () => {
    if (!confirm('删除这名员工？')) return;
    await fetch('/api/staff/' + b.dataset.del, { method: 'DELETE' });
    loadStaff();
  }));
}
$('#saveStaff').addEventListener('click', async () => {
  const body = { name: $('#s-name').value, role: $('#s-role').value, emoji: $('#s-emoji').value || '🧑', prompt: $('#s-prompt').value };
  if (!body.name.trim() || !body.prompt.trim()) { $('#staffMsg').className = 'msg err'; $('#staffMsg').textContent = '名字和提示词必填'; return; }
  const editing = $('#s-name').dataset.editing;
  if (editing) await fetch('/api/staff/' + editing, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  else await fetch('/api/staff', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  delete $('#s-name').dataset.editing;
  $('#staffMsg').className = 'msg ok'; $('#staffMsg').textContent = '已保存';
  $('#s-name').value = ''; $('#s-role').value = ''; $('#s-prompt').value = '';
  loadStaff();
});

/* 圆桌 */
$('#meet').addEventListener('click', async () => {
  const topic = $('#topic').value.trim();
  const msg = $('#meetMsg');
  if (!picked.size) { msg.className = 'msg err'; msg.textContent = '请先选员工'; return; }
  if (!topic) { msg.className = 'msg err'; msg.textContent = '请填写议题'; return; }
  msg.className = 'msg'; msg.textContent = '开会中，员工依次发言…';
  $('#meet').disabled = true;
  $('#meetOut').innerHTML = '';
  try {
    const r = await fetch('/api/group', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ topic, staffIds: [...picked] }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || '失败');
    $('#meetOut').innerHTML = j.speeches.map((s) => `
      <div class="card" style="margin-bottom:10px">
        <div class="speech" style="margin:0;border-color:#2C6C82">
          <div class="who">${s.emoji} ${s.name} · ${s.role}</div>
          <div class="txt">${s.text}</div>
        </div>
      </div>`).join('') + `
      <div class="card"><h3>主持人总结</h3><div class="summary">${j.summary}</div>
      <p class="muted" style="margin-top:10px">已保存到会议记录（本机）</p></div>`;
    msg.className = 'msg ok'; msg.textContent = j.source === 'model' ? 'AI 生成' : '演示模式（配 Key 后更真实）';
  } catch (e) { msg.className = 'msg err'; msg.textContent = '失败：' + e.message; }
  finally { $('#meet').disabled = false; }
});

/* 单聊 */
function renderChatStaff() {
  $('#chatStaff').innerHTML = staff.map((e) => `<option value="${e.id}">${e.emoji} ${e.name} · ${e.role}</option>`).join('');
}
$('#chatStaff').addEventListener('change', () => { chatHistory = []; renderChat(); });
function renderChat() {
  $('#chatBox').innerHTML = chatHistory.map((m) => `
    <div class="bubble ${m.role === 'user' ? 'me' : 'ai'}">
      ${m.role === 'assistant' ? `<div class="who">${m.who || 'AI'}</div>` : ''}${m.content}
    </div>`).join('');
  $('#chatBox').scrollTop = $('#chatBox').scrollHeight;
}
async function sendChat() {
  const text = $('#chatInput').value.trim();
  if (!text) return;
  const emp = staff.find((x) => x.id === $('#chatStaff').value);
  chatHistory.push({ role: 'user', content: text });
  $('#chatInput').value = '';
  renderChat();
  $('#send').disabled = true;
  try {
    const r = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ staffId: emp.id, message: text, history: chatHistory.slice(0, -1) }) });
    const j = await r.json();
    chatHistory.push({ role: 'assistant', content: j.reply, who: `${emp.emoji} ${emp.name}` });
    renderChat();
  } catch (e) {
    chatHistory.push({ role: 'assistant', content: '出错了：' + e.message, who: 'system' });
    renderChat();
  } finally { $('#send').disabled = false; }
}
$('#send').addEventListener('click', sendChat);
$('#chatInput').addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) sendChat(); });

loadStaff(); loadSettings();
</script>
</body>
</html>
