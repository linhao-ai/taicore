<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一键出图 · 钛核 TAICORE</title>
<style>
  :root{--bg:#05070D;--panel:#0B101C;--line:#1B2540;--cyan:#00E0FF;--violet:#7A5CFF;--text:#E9EFFA;--sub:#9AA9C2;--dim:#5C6B85;--grad:linear-gradient(135deg,#00E0FF,#7A5CFF)}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(70% 60% at 50% -10%,rgba(0,224,255,.10),transparent),var(--bg);color:var(--text);
    font-family:"Inter","HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:14px;line-height:1.6}
  .wrap{max-width:1180px;margin:0 auto;padding:24px 18px 80px}
  header{display:flex;align-items:center;gap:12px;padding:6px 0 18px}
  .logo{width:30px;height:30px}
  .brand b{font-size:16px}.brand small{display:block;font-size:9px;letter-spacing:.32em;color:var(--dim)}
  .sp{flex:1}
  .cols{display:grid;grid-template-columns:380px 1fr;gap:16px;align-items:start}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:18px}
  .card h3{margin:0 0 12px;font-size:14.5px;display:flex;align-items:center;gap:8px}
  .card h3:before{content:"";width:4px;height:14px;border-radius:2px;background:var(--grad)}
  label{display:block;font-size:12px;color:var(--sub);margin:10px 0 5px}
  input,select,textarea{width:100%;background:#070B14;border:1px solid #1C2740;border-radius:9px;color:#DCE7F5;padding:9px 11px;font-size:13px;font-family:inherit}
  textarea{min-height:64px;resize:vertical}
  .drop{border:1.5px dashed #2A3A5C;border-radius:12px;padding:26px;text-align:center;color:var(--sub);cursor:pointer;transition:.2s}
  .drop:hover,.drop.over{border-color:var(--cyan);background:rgba(0,224,255,.06);color:#CFEFFF}
  .drop img{max-width:100%;max-height:160px;border-radius:8px;margin-top:10px}
  .row{display:flex;gap:9px}.row>div{flex:1}
  button{border:0;cursor:pointer;padding:11px 18px;border-radius:10px;background:var(--grad);color:#04121A;font-weight:750;font-size:13.5px;font-family:inherit}
  button.ghost{background:rgba(255,255,255,.06);color:var(--text);border:1px solid #26344F}
  button:disabled{opacity:.55;cursor:wait}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .tile{background:#070B14;border:1px solid #1C2740;border-radius:12px;padding:10px;text-align:center}
  .tile canvas{width:100%;height:auto;border-radius:8px;display:block}
  .tile .name{font-size:12px;color:var(--sub);margin:8px 0 6px}
  .tile a{display:inline-block;font-size:12px;color:#04121A;background:var(--grad);padding:6px 12px;border-radius:8px;text-decoration:none;font-weight:700}
  .msg{font-size:12.5px;margin-top:8px;min-height:18px}.msg.ok{color:#22D3A5}.msg.err{color:#FF6B7A}
  .muted{color:var(--dim);font-size:12px}
  @media (max-width:900px){.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="logo" viewBox="0 0 96 96"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00E0FF"/><stop offset="1" stop-color="#7A5CFF"/></linearGradient></defs>
      <path d="M88 48 L68 83 L28 83 L8 48 L28 13 L68 13 Z" fill="none" stroke="url(#g)" stroke-width="6" stroke-linejoin="round"/>
      <path d="M54.5 24 L39.5 51 H48.5 L43.5 72 L60.5 43.5 H51 Z" fill="#D9FBFF"/></svg>
    <div class="brand"><b>一键出图</b><small>TAICORE</small></div>
    <div class="sp"></div>
    <span class="muted">本地生成 · 不上传 · 可商用</span>
  </header>

  <div class="cols">
    <div>
      <div class="card">
        <h3>1 · 商品图</h3>
        <div class="drop" id="drop">拖入商品图，或 <b>点击选择</b><div class="muted" style="margin-top:6px">建议白底或纯色背景，效果最好</div></div>
        <input id="file" type="file" accept="image/*" hidden>
      </div>

      <div class="card">
        <h3>2 · 文案</h3>
        <label>主标题（短，8 字以内最好）</label><input id="title" type="text" placeholder="例：手工现做 牛肉面">
        <label>卖点（每行一条，最多 3 条）</label><textarea id="points" placeholder="二十年老汤底&#10;面条手工现擀&#10;每天现熬 不隔夜"></textarea>
        <div class="row">
          <div><label>价格</label><input id="price" type="text" placeholder="例：19.9"></div>
          <div><label>促销标签</label><input id="badge" type="text" placeholder="例：限时 5 折"></div>
        </div>
        <label>风格</label>
        <select id="style">
          <option value="clean">简约白 · 通用</option>
          <option value="promo">促销红 · 冲量</option>
          <option value="lux">黑金 · 品质</option>
        </select>
        <div style="margin-top:14px"><button id="gen">生成图片</button></div>
        <div class="msg" id="msg"></div>
      </div>
    </div>

    <div class="card">
      <h3>3 · 出图结果</h3>
      <div class="muted" style="margin-bottom:10px">一次生成 4 张：平台主图 800×800、通用主图 1080×1080、促销海报 1080×1440、朋友圈方图 1080×1080（含卖点）</div>
      <div class="grid" id="out"><div class="muted">上传商品图并填写文案后点「生成图片」</div></div>
    </div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
let productImg = null;
let productName = 'product';

function loadImage(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = r.result; };
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

$('#drop').addEventListener('click', () => $('#file').click());
$('#file').addEventListener('change', async (e) => {
  const f = e.target.files[0]; if (!f) return;
  productName = f.name.replace(/\.[^.]+$/, '') || 'product';
  productImg = await loadImage(f);
  $('#drop').innerHTML = `<img src="${productImg.src}" alt=""><div class="muted" style="margin-top:8px">已选择：${f.name}</div>`;
});
['dragenter', 'dragover'].forEach((ev) => $('#drop').addEventListener(ev, (e) => { e.preventDefault(); $('#drop').classList.add('over'); }));
['dragleave', 'drop'].forEach((ev) => $('#drop').addEventListener(ev, (e) => { e.preventDefault(); $('#drop').classList.remove('over'); }));
$('#drop').addEventListener('drop', async (e) => {
  const f = e.dataTransfer.files[0]; if (!f) return;
  productName = f.name.replace(/\.[^.]+$/, '') || 'product';
  productImg = await loadImage(f);
  $('#drop').innerHTML = `<img src="${productImg.src}" alt=""><div class="muted" style="margin-top:8px">已选择：${f.name}</div>`;
});

/* ---------- 绘制工具 ---------- */
const FONT = '"Microsoft YaHei","PingFang SC",sans-serif';
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function wrapText(ctx, text, maxWidth) {
  const lines = [];
  let cur = '';
  for (const ch of text) {
    if (ctx.measureText(cur + ch).width > maxWidth) { lines.push(cur); cur = ch; } else cur += ch;
  }
  if (cur) lines.push(cur);
  return lines;
}
function fitImage(ctx, img, x, y, w, h) {
  const s = Math.min(w / img.width, h / img.height);
  const dw = img.width * s, dh = img.height * s;
  ctx.drawImage(img, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
}
const STYLES = {
  clean: { bg1: '#FFFFFF', bg2: '#F2F6FA', text: '#111827', sub: '#4B5563', accent: '#00B4D8', badgeBg: '#00B4D8', badgeFg: '#FFFFFF' },
  promo: { bg1: '#FF4D4F', bg2: '#FF7A45', text: '#FFFFFF', sub: '#FFF3E0', accent: '#FFE066', badgeBg: '#FFE066', badgeFg: '#7A1F00' },
  lux: { bg1: '#0B0F14', bg2: '#1A2029', text: '#F5E6C8', sub: '#C9B896', accent: '#D4AF37', badgeBg: '#D4AF37', badgeFg: '#1A1305' },
};

function drawBase(ctx, W, H, st) {
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, st.bg1); g.addColorStop(1, st.bg2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

/* 主图：产品 + 标题 + 价格 */
function drawMain(canvas, size, st, opts = {}) {
  const W = size, H = size;
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  drawBase(ctx, W, H, st);

  // 产品图区域
  const pad = Math.round(W * 0.08);
  const imgH = opts.showPoints ? H * 0.52 : H * 0.6;
  if (productImg) fitImage(ctx, productImg, pad, pad, W - pad * 2, imgH);

  // 标题
  const title = ($('#title').value || '').trim();
  let y = pad + imgH + Math.round(H * 0.04);
  if (title) {
    ctx.fillStyle = st.text;
    ctx.font = `bold ${Math.round(W * 0.075)}px ${FONT}`;
    const lines = wrapText(ctx, title, W - pad * 2).slice(0, 2);
    lines.forEach((l, i) => ctx.fillText(l, pad, y + i * Math.round(W * 0.09)));
    y += lines.length * Math.round(W * 0.09);
  }

  // 卖点
  if (opts.showPoints) {
    const pts = ($('#points').value || '').split('\n').map((s) => s.trim()).filter(Boolean).slice(0, 3);
    ctx.font = `${Math.round(W * 0.038)}px ${FONT}`;
    ctx.fillStyle = st.sub;
    pts.forEach((p, i) => ctx.fillText('· ' + p, pad, y + i * Math.round(W * 0.055)));
  }

  // 价格
  const price = ($('#price').value || '').trim();
  if (price) {
    ctx.fillStyle = st.accent;
    ctx.font = `bold ${Math.round(W * 0.1)}px ${FONT}`;
    const pw = ctx.measureText('¥' + price).width;
    ctx.fillText('¥' + price, W - pad - pw, H - pad);
    ctx.fillStyle = st.sub;
    ctx.font = `${Math.round(W * 0.032)}px ${FONT}`;
    ctx.fillText('起', W - pad, H - pad + Math.round(W * 0.012));
  }

  // 促销标签
  const badge = ($('#badge').value || '').trim();
  if (badge) {
    ctx.font = `bold ${Math.round(W * 0.036)}px ${FONT}`;
    const bw = ctx.measureText(badge).width + Math.round(W * 0.05);
    const bh = Math.round(W * 0.072);
    ctx.fillStyle = st.badgeBg;
    roundRect(ctx, pad, Math.round(H * 0.04), bw, bh, bh / 2); ctx.fill();
    ctx.fillStyle = st.badgeFg;
    ctx.fillText(badge, pad + Math.round(W * 0.025), Math.round(H * 0.04) + bh / 2 + Math.round(W * 0.013));
  }
}

/* 海报：竖版 1080x1440 */
function drawPoster(canvas, W, H, st) {
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  drawBase(ctx, W, H, st);
  const pad = Math.round(W * 0.08);

  // 顶部标签
  const badge = ($('#badge').value || '').trim();
  if (badge) {
    ctx.font = `bold ${Math.round(W * 0.042)}px ${FONT}`;
    const bw = ctx.measureText(badge).width + pad;
    ctx.fillStyle = st.badgeBg;
    roundRect(ctx, pad, pad, bw, Math.round(W * 0.085), Math.round(W * 0.0425)); ctx.fill();
    ctx.fillStyle = st.badgeFg;
    ctx.fillText(badge, pad + pad / 2, pad + Math.round(W * 0.06));
  }

  // 标题
  const title = ($('#title').value || '').trim();
  if (title) {
    ctx.fillStyle = st.text;
    ctx.font = `bold ${Math.round(W * 0.095)}px ${FONT}`;
    const lines = wrapText(ctx, title, W - pad * 2).slice(0, 2);
    lines.forEach((l, i) => ctx.fillText(l, pad, pad + Math.round(W * 0.2) + i * Math.round(W * 0.115)));
  }

  // 产品图
  const imgY = pad + Math.round(W * 0.42);
  if (productImg) fitImage(ctx, productImg, pad, imgY, W - pad * 2, H * 0.42);

  // 价格
  const price = ($('#price').value || '').trim();
  if (price) {
    ctx.fillStyle = st.accent;
    ctx.font = `bold ${Math.round(W * 0.16)}px ${FONT}`;
    ctx.fillText('¥' + price, pad, H - pad - Math.round(W * 0.02));
  }

  // 卖点
  const pts = ($('#points').value || '').split('\n').map((s) => s.trim()).filter(Boolean).slice(0, 3);
  ctx.font = `${Math.round(W * 0.04)}px ${FONT}`;
  ctx.fillStyle = st.sub;
  pts.forEach((p, i) => ctx.fillText('· ' + p, pad + (price ? Math.round(W * 0.42) : 0), H - pad - Math.round(W * (0.1 - i * 0.055))));
}

function makeTile(canvas, label) {
  const wrap = document.createElement('div');
  wrap.className = 'tile';
  canvas.style.background = '#fff';
  wrap.appendChild(canvas);
  const n = document.createElement('div');
  n.className = 'name'; n.textContent = label;
  wrap.appendChild(n);
  const a = document.createElement('a');
  a.textContent = '下载 PNG';
  a.download = `${productName}_${label}.png`;
  a.href = canvas.toDataURL('image/png');
  wrap.appendChild(a);
  return wrap;
}

$('#gen').addEventListener('click', () => {
  const msg = $('#msg');
  if (!productImg) { msg.className = 'msg err'; msg.textContent = '请先上传商品图'; return; }
  msg.className = 'msg'; msg.textContent = '生成中…';
  const st = STYLES[$('#style').value] || STYLES.clean;
  const out = $('#out');
  out.innerHTML = '';

  const specs = [
    { label: '主图800', w: 800, h: 800, kind: 'main' },
    { label: '主图1080', w: 1080, h: 1080, kind: 'main' },
    { label: '海报1080x1440', w: 1080, h: 1440, kind: 'poster' },
    { label: '方图带卖点', w: 1080, h: 1080, kind: 'main', showPoints: true },
  ];
  for (const s of specs) {
    const c = document.createElement('canvas');
    if (s.kind === 'poster') drawPoster(c, s.w, s.h, st);
    else drawMain(c, s.w, st, { showPoints: !!s.showPoints });
    out.appendChild(makeTile(c, s.label));
  }
  msg.className = 'msg ok';
  msg.textContent = '已生成 4 张，点每张下面的「下载 PNG」保存';
});
</script>
</body>
</html>
