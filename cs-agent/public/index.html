<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>智能客服 · 为道 WeDAO</title>
<style>
  :root{--bg:#05070D;--panel:#0B101C;--line:#1B2540;--cyan:#00E0FF;--violet:#7A5CFF;--ok:#22D3A5;--text:#E9EFFA;--sub:#9AA9C2;--dim:#5C6B85;--grad:linear-gradient(135deg,#00E0FF,#7A5CFF)}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(70% 60% at 50% -10%,rgba(0,224,255,.10),transparent),var(--bg);color:var(--text);
    font-family:"Inter","HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:14px;line-height:1.65}
  .wrap{max-width:1000px;margin:0 auto;padding:24px 18px 80px}
  header{display:flex;align-items:center;gap:12px;padding:6px 0 18px}
  .logo{width:30px;height:30px}
  .brand b{font-size:16px}.brand small{display:block;font-size:9px;letter-spacing:.32em;color:var(--dim)}
  .sp{flex:1}
  .tabs{display:flex;gap:8px;margin-bottom:16px;border-bottom:1px solid #16203A;padding-bottom:10px}
  .tab{padding:9px 15px;border-radius:10px;cursor:pointer;color:var(--sub);font-weight:650;font-size:13.5px}
  .tab.on{background:rgba(0,224,255,.1);color:#DFF9FF;box-shadow:inset 0 0 0 1px rgba(0,224,255,.25)}
  .pane{display:none}.pane.on{display:block}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:18px;margin-bottom:14px}
  .card h3{margin:0 0 12px;font-size:14.5px;display:flex;align-items:center;gap:8px}
  .card h3:before{content:"";width:4px;height:14px;border-radius:2px;background:var(--grad)}
  label{display:block;font-size:12px;color:var(--sub);margin:10px 0 5px}
  input,select,textarea{width:100%;background:#070B14;border:1px solid #1C2740;border-radius:9px;color:#DCE7F5;padding:9px 11px;font-size:13px;font-family:inherit}
  textarea{min-height:90px;resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
  .row{display:flex;gap:10px}.row>div{flex:1}
  button{border:0;cursor:pointer;padding:10px 16px;border-radius:10px;background:var(--grad);color:#04121A;font-weight:750;font-size:13px;font-family:inherit}
  button.ghost{background:rgba(255,255,255,.06);color:var(--text);border:1px solid #26344F}
  button.mini{padding:6px 10px;font-size:12px}
  button:disabled{opacity:.55;cursor:wait}
  .reply{background:#070B14;border:1px solid #1C2740;border-radius:12px;padding:14px;font-size:13.5px;white-space:pre-wrap;line-height:1.85;min-height:60px}
  .hit{border-left:3px solid #26344F;padding:6px 10px;margin:8px 0;font-size:12.5px;color:var(--sub);background:#0A0F1A;border-radius:0 8px 8px 0}
  .hit b{color:#9BE9FF;display:block;font-size:12px;margin-bottom:2px}
  .msg{font-size:12.5px;margin-top:8px;min-height:18px}.msg.ok{color:var(--ok)}.msg.err{color:#FF6B7A}
  table{width:100%;border-collapse:collapse;font-size:12.8px}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid #141C2E;vertical-align:top}
  th{color:var(--dim);font-weight:600;font-size:11.5px}
  .muted{color:var(--dim);font-size:12px}
  .faqitem{border:1px solid #1C2740;border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#0A0F1A}
  .faqitem b{font-size:13px}.faqitem p{margin:4px 0 0;font-size:12.5px;color:var(--sub)}
  @media (max-width:720px){.row{flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="logo" src="https://dl.wedao.org.cn/assets/brand/logo-mark.png" alt="为道 WeDAO">
    <div class="brand"><b>智能客服</b><small>WeDAO</small></div>
    <div class="sp"></div>
    <span class="muted" id="toneLabel"></span>
  </header>

  <div class="tabs">
    <div class="tab on" data-pane="reply">回复客户</div>
    <div class="tab" data-pane="kb">知识库</div>
    <div class="tab" data-pane="set">设置</div>
  </div>

  <!-- 回复 -->
  <div class="pane on" id="pane-reply">
    <div class="card">
      <h3>客户问了什么</h3>
      <textarea id="question" placeholder="例：你们家牛肉面多少钱一碗？可以开发票吗？" style="min-height:70px"></textarea>
      <div style="margin-top:12px;display:flex;gap:9px;align-items:center">
        <button id="gen">生成回复</button>
        <button class="ghost" id="copy">复制回复</button>
        <span class="msg" id="msg"></span>
      </div>
    </div>
    <div class="card">
      <h3>回复建议</h3>
      <div class="reply" id="reply">—</div>
      <div id="hits" style="margin-top:10px"></div>
    </div>
  </div>

  <!-- 知识库 -->
  <div class="pane" id="pane-kb">
    <div class="card">
      <h3>批量导入（每行一条：问题 | 答案）</h3>
      <textarea id="bulk" placeholder="你们几点开门？ | 我们每天 9:00-21:30，节假日不休息～&#10;能开发票吗？ | 可以开电子发票，把开票信息发我，当天出。"></textarea>
      <div style="margin-top:12px;display:flex;gap:9px;align-items:center">
        <button id="importBtn">导入</button>
        <button class="ghost" id="genFaq">AI 生成 10 条常见问题</button>
        <span class="msg" id="kbMsg"></span>
      </div>
      <div id="suggestOut" style="margin-top:12px"></div>
    </div>
    <div class="card">
      <h3>知识库（<span id="kbCount">0</span> 条）</h3>
      <table><thead><tr><th style="width:38%">问题</th><th>答案</th><th style="width:60px"></th></tr></thead>
      <tbody id="kbRows"><tr><td colspan="3" class="muted">暂无</td></tr></tbody></table>
    </div>
  </div>

  <!-- 设置 -->
  <div class="pane" id="pane-set">
    <div class="card">
      <h3>店铺信息与模型</h3>
      <label>店铺/品牌名</label><input id="shopName" type="text" placeholder="例：山城老灶">
      <label>回复语气</label>
      <select id="tone">
        <option value="亲切专业">亲切专业</option>
        <option value="热情活泼">热情活泼</option>
        <option value="简洁干练">简洁干练</option>
        <option value="高端克制">高端克制</option>
      </select>
      <label>DeepSeek API Key（留空则用内置模板+检索）</label><input id="apiKey" type="password" placeholder="sk-...">
      <div style="margin-top:14px"><button id="saveSet">保存</button> <span class="msg" id="setMsg"></span></div>
      <p class="muted" style="margin-top:12px">Key 只保存在本机 <code>~/.dsh/taicore/cs-settings.json</code>，不会上传。知识库与设置都不出本机。</p>
    </div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
document.querySelectorAll('.tab').forEach((t) => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach((x) => x.classList.remove('on'));
    document.querySelectorAll('.pane').forEach((x) => x.classList.remove('on'));
    t.classList.add('on');
    document.getElementById('pane-' + t.dataset.pane).classList.add('on');
    if (t.dataset.pane === 'kb') loadKb();
    if (t.dataset.pane === 'set') loadSettings();
  });
});

async function loadSettings() {
  const s = await (await fetch('/api/settings')).json();
  $('#shopName').value = s.shopName || '';
  $('#tone').value = s.tone || '亲切专业';
  $('#apiKey').value = '';
  $('#apiKey').placeholder = s.hasKey ? '已保存（留空则不变）' : 'sk-...';
  $('#toneLabel').textContent = (s.shopName ? s.shopName + ' · ' : '') + (s.hasKey ? 'AI 模式' : '模板模式');
}
$('#saveSet').addEventListener('click', async () => {
  const body = { shopName: $('#shopName').value, tone: $('#tone').value };
  if ($('#apiKey').value.trim()) body.apiKey = $('#apiKey').value.trim();
  await fetch('/api/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  $('#setMsg').className = 'msg ok'; $('#setMsg').textContent = '已保存';
  loadSettings();
});

$('#gen').addEventListener('click', async () => {
  const q = $('#question').value.trim();
  const msg = $('#msg');
  if (!q) { msg.className = 'msg err'; msg.textContent = '请输入客户问题'; return; }
  msg.className = 'msg'; msg.textContent = '生成中…';
  $('#gen').disabled = true;
  try {
    const r = await fetch('/api/reply', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ question: q }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || '失败');
    $('#reply').textContent = j.reply;
    $('#hits').innerHTML = (j.hits || []).length
      ? '<div class="muted" style="margin-bottom:6px">命中的知识库条目：</div>' + j.hits.map((h) => `<div class="hit"><b>${h.q}</b>${h.a}</div>`).join('')
      : '<div class="muted">知识库里没有相关问题，回复为通用兜底。建议补充到知识库。</div>';
    msg.className = 'msg ok'; msg.textContent = j.source === 'model' ? '由 AI 生成' : '模板回复（配置 API Key 后更自然）';
  } catch (e) { msg.className = 'msg err'; msg.textContent = '失败：' + e.message; }
  finally { $('#gen').disabled = false; }
});
$('#copy').addEventListener('click', async () => {
  await navigator.clipboard.writeText($('#reply').textContent || '');
  $('#copy').textContent = '已复制'; setTimeout(() => ($('#copy').textContent = '复制回复'), 1200);
});

async function loadKb() {
  const kb = await (await fetch('/api/kb')).json();
  $('#kbCount').textContent = kb.length;
  $('#kbRows').innerHTML = kb.length ? kb.map((x) => `<tr><td>${x.q}</td><td class="muted">${x.a}</td><td><button class="ghost mini" data-del="${x.id}">删</button></td></tr>`).join('') : '<tr><td colspan="3" class="muted">暂无</td></tr>';
  $('#kbRows').querySelectorAll('[data-del]').forEach((b) => b.addEventListener('click', async () => {
    await fetch('/api/kb/' + b.dataset.del, { method: 'DELETE' }); loadKb();
  }));
}
$('#importBtn').addEventListener('click', async () => {
  const bulk = $('#bulk').value.trim();
  if (!bulk) return;
  const r = await fetch('/api/kb', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ bulk }) });
  const j = await r.json();
  $('#kbMsg').className = 'msg ok'; $('#kbMsg').textContent = `导入 ${j.added} 条`;
  $('#bulk').value = ''; loadKb();
});
$('#genFaq').addEventListener('click', async () => {
  $('#kbMsg').className = 'msg'; $('#kbMsg').textContent = '生成中…';
  const r = await fetch('/api/suggest', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ industry: $('#shopName').value || '实体门店' }) });
  const j = await r.json();
  $('#suggestOut').innerHTML = (j.faq || []).map((f) => `<div class="faqitem"><b>${f.q}</b><p>${f.a}</p></div>`).join('') +
    `<div style="margin-top:10px"><button id="importSuggest" class="ghost">全部导入知识库</button></div>`;
  $('#kbMsg').className = 'msg ok'; $('#kbMsg').textContent = j.source === 'model' ? '由 AI 生成' : '模板生成（配置 Key 可更贴合你的店）';
  $('#importSuggest').addEventListener('click', async () => {
    const bulk = (j.faq || []).map((f) => `${f.q} | ${f.a}`).join('\n');
    await fetch('/api/kb', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ bulk }) });
    $('#kbMsg').textContent = '已导入'; $('#suggestOut').innerHTML = ''; loadKb();
  });
});

loadSettings();
</script>
</body>
</html>
