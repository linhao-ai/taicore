<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>视频工坊 · 为道 WeDAO</title>
<style>
  :root{--bg:#05070D;--panel:#0B101C;--line:#1B2540;--cyan:#00E0FF;--violet:#7A5CFF;--text:#E9EFFA;--sub:#9AA9C2;--dim:#5C6B85;
    --grad:linear-gradient(135deg,#00E0FF,#7A5CFF)}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(70% 60% at 50% -10%,rgba(0,224,255,.12),transparent),var(--bg);color:var(--text);
    font-family:"Inter","HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:14px;line-height:1.65}
  .wrap{max-width:1080px;margin:0 auto;padding:26px 22px 90px}
  header{display:flex;align-items:center;gap:12px;padding:10px 0 22px}
  .logo{width:30px;height:30px}
  .brand b{font-size:16px}
  .brand small{display:block;font-size:9px;letter-spacing:.32em;color:var(--dim)}
  .sp{flex:1}
  .pill{font-size:11.5px;color:#9BE9FF;border:1px solid rgba(0,224,255,.3);background:rgba(0,224,255,.08);padding:5px 11px;border-radius:999px}
  h2{font-size:15px;margin:0 0 12px;font-weight:700}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
  .drop{border:1.5px dashed #2A3A5C;border-radius:14px;padding:30px;text-align:center;color:var(--sub);cursor:pointer;transition:.2s}
  .drop:hover,.drop.over{border-color:var(--cyan);background:rgba(0,224,255,.05);color:#CFEFFF}
  .drop b{color:#DFF7FF}
  .slides{display:flex;flex-direction:column;gap:12px;margin-top:16px}
  .slide{display:flex;gap:14px;border:1px solid #1B2540;border-radius:12px;padding:12px;background:#080C15}
  .slide img{width:112px;height:112px;object-fit:cover;border-radius:9px;flex:0 0 auto;background:#000}
  .slide .body{flex:1;min-width:0}
  .slide .no{font-size:11px;color:var(--dim);margin-bottom:5px}
  textarea{width:100%;min-height:64px;resize:vertical;background:#060A12;border:1px solid #1C2740;border-radius:9px;
    color:#DCE7F5;padding:10px 12px;font-size:13px;font-family:inherit}
  textarea:focus{outline:none;border-color:#2E5B7A}
  .rm{border:1px solid #3A2436;background:rgba(255,46,136,.08);color:#FF9EC4;border-radius:8px;padding:5px 10px;font-size:11.5px;cursor:pointer;align-self:flex-start}
  .row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:11.5px;color:var(--sub)}
  select,input[type=range],input[type=file]{background:#060A12;border:1px solid #1C2740;border-radius:9px;color:#DCE7F5;padding:8px 10px;font-family:inherit;font-size:13px}
  .btn{border:0;cursor:pointer;padding:13px 26px;border-radius:11px;font-weight:750;font-size:14.5px;background:var(--grad);color:#04121A;
    box-shadow:0 10px 30px rgba(0,224,255,.25);transition:.2s}
  .btn:hover{transform:translateY(-1px)}
  .btn:disabled{opacity:.5;cursor:wait;transform:none}
  .btn.ghost{background:rgba(255,255,255,.05);color:var(--text);border:1px solid #26344F;box-shadow:none}
  .bar{height:8px;border-radius:99px;background:#0E1626;overflow:hidden;margin-top:14px}
  .bar i{display:block;height:100%;width:0;background:var(--grad);transition:width .3s}
  .msg{font-size:12.5px;color:var(--sub);margin-top:8px;min-height:18px}
  .msg.err{color:#FF7A8A}.msg.ok{color:#5BE9B9}
  video{width:100%;max-height:520px;border-radius:12px;background:#000;margin-top:12px}
  .dl{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .dl a{font-size:13px;text-decoration:none;color:#04121A;background:var(--grad);padding:9px 16px;border-radius:9px;font-weight:700}
  .dl a.ghost{background:rgba(255,255,255,.06);color:var(--text);border:1px solid #26344F}
  .hist{display:flex;flex-direction:column;gap:8px}
  .hist a{color:#9BE9FF;font-size:13px;text-decoration:none;border-bottom:1px dashed #22304C;padding:7px 0;display:flex;justify-content:space-between;gap:12px}
  .hist a span{color:var(--dim);font-size:11.5px}
  .tip{font-size:12px;color:var(--dim);margin-top:10px;line-height:1.8}
  .loading{display:none;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="logo" src="https://dl.wedao.org.cn/assets/brand/logo-mark.png" alt="为道 WeDAO">
    <div class="brand"><b>视频工坊</b><small>WeDAO</small></div>
    <div class="sp"></div>
    <span class="pill">本地生成 · 不上传云端 · 免安装依赖</span>
  </header>

  <div class="card">
    <h2>1 · 添加图片</h2>
    <div class="drop" id="drop">
      把门店照片、商品图、海报拖到这里，或 <b>点击选择</b><br>
      <span style="font-size:12px;color:var(--dim)">支持 jpg / png / webp，可一次多选，顺序即播放顺序</span>
    </div>
    <input id="file" type="file" accept="image/*" multiple hidden>
    <div class="slides" id="slides"></div>
  </div>

  <div class="card">
    <h2>2 · 参数</h2>
    <div class="row">
      <div class="field"><label>画面比例</label>
        <select id="aspect">
          <option value="vertical" selected>竖屏 9:16（抖音 / 视频号 / 小红书）</option>
          <option value="horizontal">横屏 16:9（公众号 / 门店屏）</option>
          <option value="square">方屏 1:1（朋友圈 / 点评）</option>
        </select>
      </div>
      <div class="field"><label>语速：<span id="rateVal">正常</span></label>
        <input id="rate" type="range" min="-4" max="4" step="1" value="0" style="width:180px">
      </div>
      <div class="field"><label>背景音乐</label>
        <select id="bgmName">
          <option value="">无</option>
          <option value="calm">舒缓 · 叙事</option>
          <option value="warm">温暖 · 生活</option>
          <option value="upbeat">轻快 · 促销</option>
        </select>
      </div>
    </div>
    <div class="row" style="margin-top:12px">
      <div class="field"><label>片头标题（可选）</label><input id="introTitle" type="text" placeholder="例：山城老灶 · 牛肉面"></div>
      <div class="field"><label>片头副标题</label><input id="introSub" type="text" placeholder="例：二十年只做一碗汤"></div>
    </div>
    <div class="row" style="margin-top:12px">
      <div class="field"><label>片尾标题（可选）</label><input id="outroTitle" type="text" placeholder="例：到店报暗号「为道」"></div>
      <div class="field"><label>片尾副标题</label><input id="outroSub" type="text" placeholder="例：送招牌小菜一份"></div>
    </div>
    <p class="tip">配音用系统中文语音（离线），字幕自动烧录并导出 .srt；背景音乐为内置合成音轨，无版权风险。也可上传自己的 BGM（见下方）。</p>
  </div>

  <div class="card">
    <h2>3 · 生成</h2>
    <label style="display:block;font-size:12px;color:var(--sub);margin-bottom:6px">批量开场钩子（可选，每行一条；填 ≥2 行则批量生成多条，首段文案会被替换）</label>
    <textarea id="hooks" placeholder="例：&#10;这家店我吃了十年&#10;昆明人从小吃到大的味道&#10;凌晨四点就有人在排队"></textarea>
    <div class="row" style="margin-top:12px">
      <div class="field"><label>自定义 BGM（可选，覆盖内置）</label><input id="bgm" type="file" accept="audio/*"></div>
    </div>
    <div class="row" style="margin-top:14px">
      <button class="btn" id="go">生成视频</button>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <div class="msg" id="msg"></div>
    <div id="result"></div>
  </div>

  <div class="card">
    <h2>历史作品</h2>
    <div class="hist" id="hist"><span style="color:var(--dim);font-size:12.5px">加载中…</span></div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
let slides = [];

function addFiles(files) {
  [...files].forEach((f) => {
    if (!f.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 1600;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        slides.push({ dataUrl: c.toDataURL('image/jpeg', 0.88), text: '' });
        render();
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(f);
  });
}

function render() {
  const box = $('#slides');
  box.innerHTML = slides.map((s, i) => `
    <div class="slide">
      <img src="${s.dataUrl}" alt="">
      <div class="body">
        <div class="no">第 ${i + 1} 段 · 画面文案（会自动配音 + 上字幕）</div>
        <textarea data-i="${i}" placeholder="例：老字号牛肉面，二十年只做一碗汤。">${s.text || ''}</textarea>
      </div>
      <button class="rm" data-rm="${i}">删除</button>
    </div>`).join('');
  box.querySelectorAll('textarea').forEach((t) => {
    t.addEventListener('input', () => { slides[Number(t.dataset.i)].text = t.value; });
  });
  box.querySelectorAll('[data-rm]').forEach((b) => {
    b.addEventListener('click', () => { slides.splice(Number(b.dataset.rm), 1); render(); });
  });
}

$('#drop').addEventListener('click', () => $('#file').click());
$('#file').addEventListener('change', (e) => addFiles(e.target.files));
['dragenter', 'dragover'].forEach((ev) => $('#drop').addEventListener(ev, (e) => { e.preventDefault(); $('#drop').classList.add('over'); }));
['dragleave', 'drop'].forEach((ev) => $('#drop').addEventListener(ev, (e) => { e.preventDefault(); $('#drop').classList.remove('over'); }));
$('#drop').addEventListener('drop', (e) => addFiles(e.dataTransfer.files));

$('#rate').addEventListener('input', (e) => {
  const v = Number(e.target.value);
  $('#rateVal').textContent = v === 0 ? '正常' : v > 0 ? `快 ${v}` : `慢 ${-v}`;
});

$('#go').addEventListener('click', async () => {
  const msg = $('#msg');
  if (!slides.length) { msg.className = 'msg err'; msg.textContent = '请先添加图片'; return; }
  if (!slides.some((s) => (s.text || '').trim())) {
    msg.className = 'msg err'; msg.textContent = '至少给一段写点文案，否则没有配音和字幕'; return;
  }
  $('#go').disabled = true;
  $('#result').innerHTML = '';
  msg.className = 'msg'; msg.textContent = '提交中…';
  $('#bar').style.width = '2%';

  let bgm = null;
  const bgmFile = $('#bgm').files[0];
  if (bgmFile) {
    bgm = await new Promise((res) => {
      const r = new FileReader();
      r.onload = () => res(r.result);
      r.readAsDataURL(bgmFile);
    });
  }

  const hooks = ($('#hooks').value || '').split('\n').map((s) => s.trim()).filter(Boolean);
  const payload = {
    slides: slides.map((s) => ({ image: s.dataUrl, text: (s.text || '').trim() })),
    hooks,
    opts: {
      aspect: $('#aspect').value,
      rate: Number($('#rate').value),
      bgm,
      bgmName: $('#bgmName').value,
      intro: { title: ($('#introTitle').value || '').trim(), subtitle: ($('#introSub').value || '').trim() },
      outro: { title: ($('#outroTitle').value || '').trim(), subtitle: ($('#outroSub').value || '').trim() },
    },
  };

  try {
    const r = await fetch('/api/render', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || '提交失败');
    poll(j.id);
  } catch (e) {
    msg.className = 'msg err'; msg.textContent = '失败：' + e.message;
    $('#go').disabled = false;
  }
});

async function poll(id) {
  const msg = $('#msg');
  try {
    const r = await fetch('/api/job/' + id);
    const j = await r.json();
    $('#bar').style.width = Math.max(2, j.progress) + '%';
    msg.className = 'msg'; msg.textContent = j.msg || '处理中…';
    if (j.status === 'done') {
      msg.className = 'msg ok'; msg.textContent = '生成完成';
      const vids = (j.videos && j.videos.length) ? j.videos : (j.video ? [{ url: j.video, name: 'video.mp4', hook: '' }] : []);
      $('#result').innerHTML = vids.map((v, i) => `
        <div style="margin-top:14px">
          ${vids.length > 1 ? '<div class="muted" style="margin-bottom:6px">第 ' + (i + 1) + ' 条' + (v.hook ? '：' + v.hook : '') + '</div>' : ''}
          <video controls src="${v.url}"></video>
          <div class="dl">
            <a href="${v.url}" download="${v.name || 'video.mp4'}">下载 mp4</a>
          </div>
        </div>`).join('');
      $('#go').disabled = false;
      loadHist();
      return;
    }
    if (j.status === 'error') {
      msg.className = 'msg err'; msg.textContent = '合成失败：' + (j.error || '');
      $('#go').disabled = false;
      return;
    }
    setTimeout(() => poll(id), 900);
  } catch (e) {
    msg.className = 'msg err'; msg.textContent = '查询失败：' + e.message;
    $('#go').disabled = false;
  }
}

async function loadHist() {
  try {
    const r = await fetch('/api/outputs');
    const list = await r.json();
    if (!list.length) { $('#hist').innerHTML = '<span style="color:var(--dim);font-size:12.5px">还没有作品</span>'; return; }
    $('#hist').innerHTML = list.map((x) =>
      `<a href="/output/${encodeURIComponent(x.name)}" download>${x.name}<span>${(x.size / 1024 / 1024).toFixed(1)} MB</span></a>`
    ).join('');
  } catch (e) {
    $('#hist').innerHTML = '<span style="color:#FF7A8A;font-size:12.5px">加载失败</span>';
  }
}
loadHist();
</script>
</body>
</html>
