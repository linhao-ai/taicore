<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>为道 WeDAO · 已登录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%;background:#05070d;font-family:"Microsoft YaHei",system-ui,sans-serif;color:#e9f1ff;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch}
#bg{position:fixed;inset:0;z-index:0}
.glow{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(820px 520px at 50% 42%,rgba(34,211,238,.10),transparent 68%)}
.wrap{position:relative;z-index:2;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:14px;padding:calc(env(safe-area-inset-top, 0px) + 26px) 16px 40px;box-sizing:border-box}
.logo{width:78px;height:78px;margin-top:6px;filter:drop-shadow(0 0 26px rgba(245,194,75,.35));animation:breathe 4.5s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.92}50%{transform:scale(1.05);opacity:1}}
h1{font-size:26px;margin-top:4px;font-weight:800;letter-spacing:.04em;
  background:linear-gradient(90deg,#eaf6ff,#8fe6ff 45%,#a5b4fc);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:13px;color:#7c8ba6;letter-spacing:.22em}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:26px;max-width:880px;padding:0 20px}
.card{padding:18px 16px;border-radius:14px;text-align:left;cursor:default;
  background:linear-gradient(160deg,rgba(18,28,46,.85),rgba(10,16,28,.92));
  border:1px solid rgba(120,200,255,.14);transition:.22s}
.card{border-color:rgba(120,200,255,.14)}
.card b{display:block;font-size:14px;margin-bottom:6px}
.card span{font-size:11.5px;color:#7c8ba6;line-height:1.6}
.badge{margin-top:22px;font-size:12px;color:#7ee7ff;border:1px solid rgba(34,211,238,.3);
  background:rgba(34,211,238,.08);padding:6px 14px;border-radius:999px}

.ico{font-size:20px;margin-bottom:10px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,rgba(34,211,238,.16),rgba(99,102,241,.16));border:1px solid rgba(34,211,238,.22)}
@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.cards{grid-template-columns:1fr 1fr;gap:10px;padding:0 4px;margin-top:16px}.card{padding:14px 12px}.card b{font-size:13px}.card span{font-size:11px;line-height:1.5}.ico{width:32px;height:32px;font-size:17px}}</style></head>
<body>
<canvas id="bg"></canvas><div class="glow"></div>
<div class="wrap">
  <img class="logo" src="https://dl.wedao.org.cn/assets/brand/logo-mark.png" alt="为道">
  <h1 id="ttl" style="display:none"></h1>
  <div class="sub">为道 WeDAO · AI 工作台</div>
  <div class="badge" id="credits">正在读取账号…</div>
  <div style="margin-top:6px"><a id="enterWb" href="#" style="display:inline-block;padding:10px 26px;border-radius:999px;background:rgba(34,211,238,.14);border:1px solid rgba(34,211,238,.45);color:#bff3ff;font-weight:700;text-decoration:none;font-size:13.5px">进入工作台 →</a></div>
  <div id="loginHint" style="display:none"><a href="/" style="display:inline-block;margin-top:10px;padding:9px 22px;border-radius:999px;background:linear-gradient(135deg,#22d3ee,#6366f1);color:#04121a;font-weight:800;text-decoration:none;font-size:13px">去登录</a></div>
  <div class="cards">
    <div class="card"><div class="ico">🖼</div><b>AI 一键出图</b><span>上传商品图 → 卖点提炼 → 主图 + 详情页</span></div>
    <div class="card"><div class="ico">🎨</div><b>主图设计器</b><span>拖拽排版 · 描边 · 导出 PNG</span></div>
    <div class="card"><div class="ico">👥</div><b>AI 员工团队</b><span>11 角色 · 15 工作流 · 圆桌会议</span></div>
    <div class="card"><div class="ico">🎬</div><b>视频工坊</b><span>AI 配图 + 文案 + 21 音色 → 成片</span></div>
    <div class="card"><div class="ico">📡</div><b>获客助手</b><span>抖音/小红书评论意向 · 回复草稿 · 线索</span></div>
    <div class="card"><div class="ico">🎧</div><b>客服助手</b><span>话术库 · 售后处理 · 差评挽回</span></div>
    <div class="card"><div class="ico">📊</div><b>用量中心</b><span>额度查询 · 消耗明细 · 充值</span></div>
    <div class="card"><div class="ico">📱</div><b>手机访问</b><span>扫码手机打开 · 异地实时同步</span></div>
  </div>
  <div style="font-size:12px;color:#5f6f8a;margin-top:16px">登录后请在「AI 工作台」中使用这些功能</div>
</div>
<script>
var c=document.getElementById('bg'),x=c.getContext('2d'),W,H,P=[],N=150,D=180;
function rs(){var d=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(d,0,0,d,0,0)}
function init(){P=[];for(var i=0;i<N;i++)P.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.2,vy:(Math.random()-.5)*.2,r:Math.random()*1.1+.3})}
function loop(){x.clearRect(0,0,W,H);
  for(var i=0;i<P.length;i++){var p=P[i];p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
    x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fillStyle='rgba(120,214,255,.22)';x.fill()}
  for(var a=0;a<P.length;a++)for(var b=a+1;b<P.length;b++){var dx=P[a].x-P[b].x,dy=P[a].y-P[b].y,d=Math.sqrt(dx*dx+dy*dy);
    if(d<D){x.beginPath();x.moveTo(P[a].x,P[a].y);x.lineTo(P[b].x,P[b].y);
      x.strokeStyle='rgba(46,190,235,'+(0.06*(1-d/D)).toFixed(3)+')';x.lineWidth=1;x.stroke()}}
  requestAnimationFrame(loop)}
rs();init();loop();addEventListener('resize',function(){rs();init()});

(function(){var e=document.getElementById("enterWb");if(e){e.href="http://"+location.hostname+":3081/?desk=1";}})();
(async function(){
  var t=localStorage.getItem('wedao_token')||'';
  var el=document.getElementById('credits');
  if(!t){ el.textContent='未登录 · 点击下方登录'; var h=document.getElementById('loginHint'); if(h) h.style.display='block'; var tt=document.getElementById('ttl'); if(tt) tt.textContent='请先登录'; return; }
  try{
    var r=await fetch('/api/auth/me',{headers:{Authorization:'Bearer '+t}});
    var j=await r.json();
    el.textContent = j.ok ? ('账号 '+j.user.mobile+' · 剩余 '+j.user.credits+' 次') : '登录已过期';
    var tt=document.getElementById('ttl'); if(tt&&j.ok) tt.textContent='已登录';
  }catch(e){ el.textContent='登录服务未启动'; }
})();
</script>
</body></html>
