name: build-taicore

on:
  workflow_dispatch:
    inputs:
      cos_secret_id:
        description: 'COS SecretId（留空则跳过上传）'
        required: false
      cos_secret_key:
        description: 'COS SecretKey'
        required: false
      publish_notes:
        description: '更新说明'
        required: false
        default: ''
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout upstream (DSH Desktop)
        uses: actions/checkout@v4
        with:
          repository: myYangyunfan/dsh_desktop
          path: upstream
          fetch-depth: 1

      - name: Checkout branding (this repo)
        uses: actions/checkout@v4
        with:
          path: branding-repo

      - name: Apply TAICORE branding
        shell: pwsh
        run: pwsh -NoProfile -File branding-repo/branding/apply-brand.ps1 -Upstream upstream -Branding branding-repo

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install JS deps
        working-directory: upstream/dsh-desktop
        run: npm ci --omit=dev

      - name: Fetch bundled runtime (node + npm -> vendor/)
        shell: bash
        working-directory: upstream/dsh-desktop
        run: npm run fetch-runtime

      - name: Stage payload (dsh-tauri/pp)
        shell: bash
        working-directory: upstream
        run: bash dsh-tauri/scripts/stage-payload.sh

      - name: Slim payload (drop npm, source maps, tests)
        shell: pwsh
        run: |
          $pp = 'upstream/dsh-tauri/pp'
          if (-not (Test-Path $pp)) { throw "payload dir not found: $pp" }
          $npmDir = Join-Path $pp 'vendor/npm'
          if (Test-Path $npmDir) {
            Remove-Item $npmDir -Recurse -Force
            Write-Host '[slim] removed vendor/npm'
          }
          $maps = Get-ChildItem $pp -Recurse -File -Include '*.map' -ErrorAction SilentlyContinue
          if ($maps) { $maps | Remove-Item -Force; Write-Host "[slim] removed $($maps.Count) source maps" }
          $docs = Get-ChildItem (Join-Path $pp 'node_modules') -Recurse -File -Include '*.md','*.d.ts' -ErrorAction SilentlyContinue
          if ($docs) { $docs | Remove-Item -Force; Write-Host "[slim] removed $($docs.Count) docs/dts" }
          foreach ($dir in (Get-ChildItem $pp -Recurse -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -in @('test','tests','__tests__','.github') })) {
            if (Test-Path $dir.FullName) { Remove-Item $dir.FullName -Recurse -Force -ErrorAction SilentlyContinue }
          }
          Write-Host '[slim] done'
      - name: Bundle video workshop
        shell: pwsh
        run: |
          $pp = 'upstream/dsh-tauri/pp'
          if (-not (Test-Path $pp)) { throw "payload dir not found: $pp" }
          $dst = Join-Path $pp 'video-workshop'
          if (Test-Path $dst) { Remove-Item $dst -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item -Recurse -Force 'branding-repo/video-workshop/*' $dst
          $tgz = Join-Path $env:TEMP 'ffmpeg-win64.tgz'
          Invoke-WebRequest -Uri 'https://registry.npmmirror.com/@ffmpeg-installer/win32-x64/-/win32-x64-4.1.0.tgz' -OutFile $tgz
          $tmp = Join-Path $env:TEMP 'ffmpeg-x'
          Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          tar -xzf $tgz -C $tmp
          New-Item -ItemType Directory -Force -Path (Join-Path $dst 'bin') | Out-Null
          Copy-Item (Join-Path $tmp 'package/ffmpeg.exe') (Join-Path $dst 'bin/ffmpeg.exe') -Force
          Write-Host '[bundle] video workshop + ffmpeg ready'
          if (Test-Path 'branding-repo/usage-center') {
            $dst2 = Join-Path $pp 'usage-center'
            if (Test-Path $dst2) { Remove-Item $dst2 -Recurse -Force }
            New-Item -ItemType Directory -Force -Path $dst2 | Out-Null
            Copy-Item -Recurse -Force 'branding-repo/usage-center/*' $dst2
            Write-Host '[bundle] usage center ready'
          }
          if (Test-Path 'branding-repo/mobile-gateway') {
            $dst3 = Join-Path $pp 'mobile-gateway'
            if (Test-Path $dst3) { Remove-Item $dst3 -Recurse -Force }
            New-Item -ItemType Directory -Force -Path $dst3 | Out-Null
            Copy-Item -Recurse -Force 'branding-repo/mobile-gateway/*' $dst3
            Write-Host '[bundle] mobile gateway ready'
          }
          if (Test-Path 'branding-repo/get-clients') {
            $dst4 = Join-Path $pp 'get-clients'
            if (Test-Path $dst4) { Remove-Item $dst4 -Recurse -Force }
            New-Item -ItemType Directory -Force -Path $dst4 | Out-Null
            Copy-Item -Recurse -Force 'branding-repo/get-clients/*' $dst4
            Write-Host '[bundle] get-clients ready'
          }
          foreach ($tool in @('img-studio','cs-agent','canvas-studio','team-room')) {
            if (Test-Path "branding-repo/$tool") {
              $dst = Join-Path $pp $tool
              if (Test-Path $dst) { Remove-Item $dst -Recurse -Force }
              New-Item -ItemType Directory -Force -Path $dst | Out-Null
              Copy-Item -Recurse -Force "branding-repo/$tool/*" $dst
              Write-Host "[bundle] $tool ready"
            }
          }

          if (Test-Path 'branding-repo/ext') {
            $dstE = Join-Path $pp 'ext'
            if (Test-Path $dstE) { Remove-Item $dstE -Recurse -Force }
            New-Item -ItemType Directory -Force -Path $dstE | Out-Null
            Copy-Item -Recurse -Force 'branding-repo/ext/*' $dstE
            Write-Host '[bundle] ext updater ready'
          }

      - name: Write version.json (for self-update)
        shell: pwsh
        working-directory: upstream/dsh-tauri
        run: |
          $ver = (Get-Content 'src/app/tauri.conf.json' -Raw | ConvertFrom-Json).version
          @{ version = $ver; product = 'WeDAO'; builtAt = (Get-Date).ToString('o') } | ConvertTo-Json | Set-Content 'pp/version.json' -Encoding UTF8
          Write-Host "[version] pp/version.json -> $ver"

      - name: Build installer
        working-directory: upstream/dsh-tauri
        run: npx --yes @tauri-apps/cli build --config src-tauri/src/app/tauri.conf.json --target x86_64-pc-windows-msvc

      - name: Collect artifact
        shell: pwsh
        run: |
          $src = 'upstream/dsh-tauri/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis'
          $exe = Get-ChildItem -Path $src -Filter '*.exe' -Recurse | Select-Object -First 1
          if (-not $exe) { throw "installer not found under $src" }
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $dst = "out/TAICORE-Setup.exe"
          Copy-Item $exe.FullName $dst
          (Get-FileHash $dst -Algorithm SHA256).Hash.ToLower() | Set-Content "$dst.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: TAICORE-windows
          path: out/*

      - name: Publish to COS (installer + latest.json)
        if: ${{ inputs.cos_secret_id != '' && inputs.cos_secret_key != '' }}
        shell: pwsh
        env:
          COS_SECRET_ID: ${{ inputs.cos_secret_id }}
          COS_SECRET_KEY: ${{ inputs.cos_secret_key }}
        run: |
          $ver = (Get-Content 'branding-repo/branding/tauri.conf.json' -Raw | ConvertFrom-Json).version
          Write-Host "publishing version $ver"
          node branding-repo/scripts/upload-installer.mjs --file out/TAICORE-Setup.exe --version $ver --notes "${{ inputs.publish_notes }}"
