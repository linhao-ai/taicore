name: publish-upload

# 只做一件事：把某次构建产物下载下来并上传到 COS（不重新构建）
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: '构建的 run id（例如 44308135539）'
        required: true
      cos_secret_id:
        description: 'COS SecretId'
        required: true
      cos_secret_key:
        description: 'COS SecretKey'
        required: true
      publish_notes:
        description: '更新说明'
        required: false
        default: ''
      version_override:
        description: '版本号（留空则读 branding/tauri.conf.json）'
        required: false
        default: ''

jobs:
  upload:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: TAICORE-windows
          path: out
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to COS
        shell: pwsh
        env:
          COS_SECRET_ID: ${{ inputs.cos_secret_id }}
          COS_SECRET_KEY: ${{ inputs.cos_secret_key }}
        run: |
          Get-ChildItem out | Format-Table Name,Length
          $ver = "${{ inputs.version_override }}"
          if ([string]::IsNullOrWhiteSpace($ver)) {
            $ver = (Get-Content 'branding/tauri.conf.json' -Raw | ConvertFrom-Json).version
          }
          Write-Host "publishing version $ver"
          node scripts/upload-installer.mjs --file out/TAICORE-Setup.exe --version $ver --notes "${{ inputs.publish_notes }}"
