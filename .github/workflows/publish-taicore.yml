name: publish-taicore

# 把已构建好的安装包发布成 Release 资产（便于用国内镜像加速下载）
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: '构建运行 ID（Actions 里的数字）'
        required: true
        default: '43714458420'
      version:
        description: '版本标签'
        required: true
        default: 'v1.0.9'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact from the build run
        uses: actions/download-artifact@v4
        with:
          name: TAICORE-windows
          path: dist
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show files
        run: ls -lh dist

      - name: Create release and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ inputs.version }}" || gh release create "${{ inputs.version }}" \
            --title "TAICORE ${{ inputs.version }}" \
            --notes "钛核 TAICORE Windows 安装包（Tauri + 内置内核，MIT 上游构建）" \
            --prerelease
          for f in dist/*; do
            gh release upload "${{ inputs.version }}" "$f" --clobber
          done
