name: upload-to-cos

# 把已构建的安装包从 GitHub 直接传到腾讯云 COS（服务器之间传输，绕开本地弱网）
# 注意：为简化交接，密钥通过 workflow_dispatch 输入传入；仓库保持私有。
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: '构建运行 ID'
        required: true
      cos_secret_id:
        description: 'COS SecretId'
        required: true
      cos_secret_key:
        description: 'COS SecretKey'
        required: true
      cos_bucket:
        description: 'Bucket（含 APPID）'
        required: true
      cos_region:
        description: 'Region'
        required: true

permissions:
  contents: read
  actions: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: TAICORE-windows
          path: dist
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: List
        run: ls -lh dist

      - name: Install coscmd
        run: pip install --quiet coscmd

      - name: Configure and upload
        env:
          COS_SECRET_ID: ${{ inputs.cos_secret_id }}
          COS_SECRET_KEY: ${{ inputs.cos_secret_key }}
          COS_BUCKET: ${{ inputs.cos_bucket }}
          COS_REGION: ${{ inputs.cos_region }}
        run: |
          set -e
          coscmd config -a "$COS_SECRET_ID" -s "$COS_SECRET_KEY" -b "$COS_BUCKET" -r "$COS_REGION"
          coscmd upload dist/TAICORE-Setup.exe /TAICORE-Setup.exe
          coscmd upload dist/TAICORE-Setup.exe.sha256 /TAICORE-Setup.exe.sha256
          coscmd setacl /TAICORE-Setup.exe --grant-read "anyone"
          coscmd setacl /TAICORE-Setup.exe.sha256 --grant-read "anyone"
          coscmd info /TAICORE-Setup.exe
