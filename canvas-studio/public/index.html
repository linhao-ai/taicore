<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>无限画布 · 钛核 TAICORE</title>
<style>
  :root{--bg:#080B12;--grid:#141B2A;--panel:#0B101C;--line:#1B2540;--cyan:#00E0FF;--text:#E9EFFA;--sub:#9AA9C2;--dim:#5C6B85;--grad:linear-gradient(135deg,#00E0FF,#7A5CFF)}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);
    font-family:"Inter","HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  #viewport{position:fixed;inset:0;overflow:hidden;cursor:grab;
    background-image:radial-gradient(circle at 1px 1px, var(--grid) 1px, transparent 0);background-size:24px 24px}
  #viewport.panning{cursor:grabbing}
  #world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
  .node{position:absolute;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.35);user-select:none}
  .node.note{background:#121A2A;border:1px solid #22304A;padding:14px;font-size:14px;line-height:1.6;color:#DCE7F5;white-space:pre-wrap;overflow:hidden}
  .node.note[data-color="cyan"]{background:#0E2A33;border-color:#1D5C6B}
  .node.note[data-color="violet"]{background:#1A1633;border-color:#3B2E6B}
  .node.note[data-color="gold"]{background:#2A2310;border-color:#6B5520;color:#FFE9B8}
  .node.text{background:transparent;border:1px dashed transparent;padding:8px;font-size:20px;font-weight:700;color:#EAF3FF;white-space:pre-wrap}
  .node.text:hover{border-color:#2A3A5C}
  .node.img{background:transparent;border:1px solid #22304A;overflow:hidden}
  .node.img img{width:100%;height:100%;object-fit:contain;background:#0A0F1A;display:block}
  .node.sel{outline:2px solid var(--cyan);outline-offset:2px}
  .node textarea{width:100%;height:100%;background:transparent;border:0;outline:0;resize:none;color:inherit;font:inherit;padding:0}
  #bar{position:fixed;left:50%;top:16px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;
    background:rgba(11,16,28,.92);border:1px solid var(--line);border-radius:14px;padding:9px 12px;backdrop-filter:blur(10px);z-index:10}
  #bar .logo{width:22px;height:22px}
  #bar button{white-space:nowrap;border:0;cursor:pointer;padding:8px 13px;border-radius:9px;background:rgba(255,255,255,.07);color:var(--text);font-weight:650;font-size:12.5px;font-family:inherit;border:1px solid #22304A}
  #bar button:hover{background:rgba(0,224,255,.12);border-color:#2C6C82;color:#DFF9FF}
  #bar button.pri{background:var(--grad);color:#04121A;border:0}
  #bar .sep{width:1px;height:22px;background:#22304A;margin:0 2px}
  #hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);font-size:11.5px;color:var(--dim);
    background:rgba(11,16,28,.85);padding:6px 12px;border-radius:99px;border:1px solid #16203A;z-index:10;white-space:nowrap}
  #zoom{font-size:12px;color:var(--sub);min-width:46px;text-align:center}
  input[type=file]{display:none}
</style>
</head>
<body>
<div id="viewport">
  <div id="world"></div>
</div>

<div id="bar">
  <svg class="logo" viewBox="0 0 96 96"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00E0FF"/><stop offset="1" stop-color="#7A5CFF"/></linearGradient></defs>
    <path d="M88 48 L68 83 L28 83 L8 48 L28 13 L68 13 Z" fill="none" stroke="url(#g)" stroke-width="6" stroke-linejoin="round"/>
    <path d="M54.5 24 L39.5 51 H48.5 L43.5 72 L60.5 43.5 H51 Z" fill="#D9FBFF"/></svg>
  <button id="addNote">+ 便签</button>
  <button id="addText">+ 文字</button>
  <button id="addImg">+ 图片</button>
  <div class="sep"></div>
  <button id="zoomOut">－</button>
  <span id="zoom">100%</span>
  <button id="zoomIn">＋</button>
  <button id="fit">适应</button>
  <div class="sep"></div>
  <button id="save">保存</button>
  <button id="load">读取</button>
  <button class="pri" id="export">导出 PNG</button>
  <button id="clear">清空</button>
</div>
<div id="hint">滚轮缩放 · 空白处拖动平移 · 双击编辑文字 · Delete 删除选中</div>
<input id="file" type="file" accept="image/*" multiple>

<script>
const $ = (s) => document.querySelector(s);
const viewport = $('#viewport'), world = $('#world');
let zoom = 1, tx = 0, ty = 0;
let selected = null;
const nodes = new Map();
const STORAGE = 'taicore.canvas.v1';
let seq = 1;

function applyTransform() {
  world.style.transform = `translate(${tx}px, ${ty}px) scale(${zoom})`;
  $('#zoom').textContent = Math.round(zoom * 100) + '%';
}

/* 判断事件目标是否是节点 */
function isNode(t) { return t.closest && t.closest('.node'); }

viewport.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = viewport.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const wx = (mx - tx) / zoom, wy = (my - ty) / zoom;
  const next = Math.min(3, Math.max(0.15, zoom * (e.deltaY < 0 ? 1.1 : 0.9)));
  zoom = next;
  tx = mx - wx * zoom; ty = my - wy * zoom;
  applyTransform();
}, { passive: false });

let panning = false, sx = 0, sy = 0, stx = 0, sty = 0;
viewport.addEventListener('pointerdown', (e) => {
  if (isNode(e.target)) return;
  if (e.button !== 0 && e.button !== 1) return;
  panning = true; viewport.classList.add('panning');
  sx = e.clientX; sy = e.clientY; stx = tx; sty = ty;
  viewport.setPointerCapture(e.pointerId);
  select(null);
});
viewport.addEventListener('pointermove', (e) => {
  if (!panning) return;
  tx = stx + (e.clientX - sx); ty = sty + (e.clientY - sy);
  applyTransform();
});
viewport.addEventListener('pointerup', () => { panning = false; viewport.classList.remove('panning'); });

function select(node) {
  if (selected) selected.classList.remove('sel');
  selected = node;
  if (node) node.classList.add('sel');
}

function createNode(type, opts = {}) {
  const id = 'n' + (seq++);
  const el = document.createElement('div');
  el.className = 'node ' + type;
  el.dataset.id = id;
  el.style.left = (opts.x ?? 120) + 'px';
  el.style.top = (opts.y ?? 120) + 'px';
  el.style.width = (opts.w ?? (type === 'note' ? 240 : type === 'img' ? 320 : 260)) + 'px';
  el.style.height = (opts.h ?? (type === 'note' ? 150 : type === 'img' ? 220 : 60)) + 'px';
  const node = { id, type, x: opts.x ?? 120, y: opts.y ?? 120, w: opts.w ?? 240, h: opts.h ?? 150, text: opts.text || '', src: opts.src || '', color: opts.color || '' };
  nodes.set(id, node);

  if (type === 'note' || type === 'text') {
    el.textContent = node.text || (type === 'note' ? '双击编辑便签' : '双击编辑文字');
    if (type === 'note' && node.color) el.dataset.color = node.color;
    el.addEventListener('dblclick', (e) => { e.stopPropagation(); editNode(node, el); });
  } else if (type === 'img') {
    el.innerHTML = `<img src="${node.src}" alt="">`;
  }
  world.appendChild(el);
  bindDrag(node, el);
  select(el);
  return { node, el };
}

function bindDrag(node, el) {
  let dragging = false, dx = 0, dy = 0;
  el.addEventListener('pointerdown', (e) => {
    if (e.target.tagName === 'TEXTAREA') return;
    e.stopPropagation();
    select(el);
    dragging = true;
    dx = e.clientX - node.x * zoom - tx;
    dy = e.clientY - node.y * zoom - ty;
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    node.x = (e.clientX - dx - tx) / zoom;
    node.y = (e.clientY - dy - ty) / zoom;
    el.style.left = node.x + 'px';
    el.style.top = node.y + 'px';
  });
  el.addEventListener('pointerup', () => { dragging = false; });
}

function editNode(node, el) {
  const ta = document.createElement('textarea');
  ta.value = node.text;
  el.textContent = '';
  el.appendChild(ta);
  ta.focus();
  const done = () => {
    node.text = ta.value;
    el.textContent = node.text || ' ';
  };
  ta.addEventListener('blur', done);
  ta.addEventListener('keydown', (e) => { if (e.key === 'Escape') ta.blur(); });
}

document.addEventListener('keydown', (e) => {
  if ((e.key === 'Delete' || e.key === 'Backspace') && selected && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) {
    const id = selected.dataset.id;
    nodes.delete(id);
    selected.remove();
    selected = null;
  }
});

$('#addNote').addEventListener('click', () => createNode('note', { x: (-tx + 200) / zoom, y: (-ty + 160) / zoom }));
$('#addText').addEventListener('click', () => createNode('text', { x: (-tx + 200) / zoom, y: (-ty + 160) / zoom }));
$('#addImg').addEventListener('click', () => $('#file').click());
$('#file').addEventListener('change', async (e) => {
  const files = [...e.target.files];
  for (let i = 0; i < files.length; i++) {
    const src = await new Promise((res) => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(files[i]); });
    createNode('img', { x: (-tx + 260) / zoom + i * 40, y: (-ty + 200) / zoom + i * 40, src });
  }
  e.target.value = '';
});

$('#zoomIn').addEventListener('click', () => { zoom = Math.min(3, zoom * 1.2); applyTransform(); });
$('#zoomOut').addEventListener('click', () => { zoom = Math.max(0.15, zoom / 1.2); applyTransform(); });
$('#fit').addEventListener('click', fitView);

function bounds() {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const n of nodes.values()) {
    minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
    maxX = Math.max(maxX, n.x + n.w); maxY = Math.max(maxY, n.y + n.h);
  }
  if (!isFinite(minX)) return null;
  return { minX, minY, maxX, maxY, w: maxX - minX, h: maxY - minY };
}
function fitView() {
  const b = bounds();
  if (!b) { zoom = 1; tx = 0; ty = 0; applyTransform(); return; }
  const W = viewport.clientWidth, H = viewport.clientHeight;
  zoom = Math.min(1.2, Math.min((W - 120) / b.w, (H - 160) / b.h));
  tx = (W - b.w * zoom) / 2 - b.minX * zoom;
  ty = (H - b.h * zoom) / 2 - b.minY * zoom;
  applyTransform();
}

/* 保存/读取（localStorage + 文件导出） */
function serialize() { return JSON.stringify({ zoom, tx, ty, nodes: [...nodes.values()] }); }
$('#save').addEventListener('click', () => {
  localStorage.setItem(STORAGE, serialize());
  const blob = new Blob([serialize()], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '钛核画布_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
});
$('#load').addEventListener('click', () => {
  const raw = localStorage.getItem(STORAGE);
  if (!raw) { alert('本机还没有保存过画布'); return; }
  restore(JSON.parse(raw));
});
function restore(data) {
  for (const [, el] of [...world.children].map((c) => [c.dataset.id, c])) el.remove();
  nodes.clear(); world.innerHTML = ''; selected = null;
  (data.nodes || []).forEach((n) => { const { el } = createNode(n.type, n); });
  zoom = data.zoom || 1; tx = data.tx || 0; ty = data.ty || 0;
  applyTransform();
}
$('#clear').addEventListener('click', () => {
  if (!confirm('清空当前画布？')) return;
  world.innerHTML = ''; nodes.clear(); selected = null; zoom = 1; tx = 0; ty = 0; applyTransform();
});

/* 导出 PNG：把节点重绘到离屏 canvas */
$('#export').addEventListener('click', async () => {
  const b = bounds();
  if (!b) { alert('画布是空的'); return; }
  const pad = 60;
  const MAX = 4096;
  let scale = 2;
  while ((b.w + pad * 2) * scale > MAX || (b.h + pad * 2) * scale > MAX) scale /= 2;
  const W = Math.round((b.w + pad * 2) * scale), H = Math.round((b.h + pad * 2) * scale);
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#080B12'; ctx.fillRect(0, 0, W, H);
  ctx.scale(scale, scale);
  ctx.translate(-b.minX + pad, -b.minY + pad);

  const roundRect = (x, y, w, h, r) => { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); };
  const wrap = (text, maxW, font) => {
    ctx.font = font; const lines = [];
    for (const para of String(text || '').split('\n')) {
      let cur = '';
      for (const ch of para) { if (ctx.measureText(cur + ch).width > maxW) { lines.push(cur); cur = ch; } else cur += ch; }
      lines.push(cur);
    }
    return lines;
  };

  const jobs = [];
  for (const n of nodes.values()) {
    if (n.type === 'img' && n.src) {
      jobs.push(new Promise((res) => {
        const img = new Image();
        img.onload = () => {
          const s = Math.min(n.w / img.width, n.h / img.height);
          const dw = img.width * s, dh = img.height * s;
          ctx.fillStyle = '#0A0F1A'; roundRect(n.x, n.y, n.w, n.h, 10); ctx.fill();
          ctx.drawImage(img, n.x + (n.w - dw) / 2, n.y + (n.h - dh) / 2, dw, dh);
          res();
        };
        img.onerror = res;
        img.src = n.src;
      }));
    }
  }
  await Promise.all(jobs);

  for (const n of nodes.values()) {
    if (n.type === 'note') {
      const colors = { '': ['#121A2A', '#22304A', '#DCE7F5'], cyan: ['#0E2A33', '#1D5C6B', '#DCE7F5'], violet: ['#1A1633', '#3B2E6B', '#DCE7F5'], gold: ['#2A2310', '#6B5520', '#FFE9B8'] };
      const [bg, bd, fg] = colors[n.color || ''] || colors[''];
      ctx.fillStyle = bg; roundRect(n.x, n.y, n.w, n.h, 12); ctx.fill();
      ctx.strokeStyle = bd; ctx.lineWidth = 1; ctx.stroke();
      const font = '14px "Microsoft YaHei","PingFang SC",sans-serif';
      ctx.fillStyle = fg;
      const lines = wrap(n.text, n.w - 28, font);
      ctx.font = font;
      lines.slice(0, Math.floor((n.h - 24) / 23)).forEach((l, i) => ctx.fillText(l, n.x + 14, n.y + 26 + i * 23));
    } else if (n.type === 'text') {
      const font = 'bold 20px "Microsoft YaHei","PingFang SC",sans-serif';
      ctx.font = font; ctx.fillStyle = '#EAF3FF';
      const lines = wrap(n.text, n.w - 16, font);
      lines.forEach((l, i) => ctx.fillText(l, n.x + 8, n.y + 28 + i * 28));
    }
  }

  const a = document.createElement('a');
  a.href = cv.toDataURL('image/png');
  a.download = '钛核画布_' + Date.now() + '.png';
  a.click();
});

/* 初始化 */
applyTransform();
createNode('note', { x: 80, y: 80, w: 300, h: 170, text: '钛核无限画布\n\n把门店照片、卖点、活动想法拖进来，一块屏想清楚。', color: 'cyan' });
createNode('text', { x: 420, y: 80, w: 320, h: 70, text: '本周活动：到店送小菜' });
</script>
</body>
</html>
